name: SHAI Core CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'gaebal/**'
      - 'omx-issue-*'
    paths:
      - .github/workflows/shai-core-ci.yml
      - shai-core/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/shai-core-ci.yml
      - shai-core/**
  workflow_dispatch:

concurrency:
  group: shai-core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: shai-core/api

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shai-core/api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest
