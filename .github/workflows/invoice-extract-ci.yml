name: invoice-extract CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/invoice-extract-ci.yml
      - invoice-extract/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/invoice-extract-ci.yml
      - invoice-extract/**
  workflow_dispatch:

concurrency:
  group: invoice-extract-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: invoice-extract

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and a current release.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: invoice-extract/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        # The suite stubs every API call, so no credentials are needed.
        run: pytest -q

  example-config:
    name: example config loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: invoice-extract/pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Load the shipped example configuration
        # These are what a new deployment copies, so a broken example is a
        # broken first run.
        run: |
          python - <<'PY'
          from pathlib import Path
          from invoice_extract.config import Config, GLConfig

          config = Config.load(Path("config/config.example.yaml"))
          gl = GLConfig.load(Path("config/gl_accounts.example.yaml"))
          print(f"{len(config.columns)} column(s), {len(gl.accounts)} account(s), "
                f"{len(gl.vendor_rules)} vendor rule(s)")
          PY
